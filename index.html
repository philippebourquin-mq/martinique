<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guide Martinique</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://philippebourquin-mq.github.io/guide-engine/engine.css" />
</head>
<body class="text-stone-800 antialiased">

  <!-- ── Header ───────────────────────────────────────────────── -->
  <header id="site-header" class="fixed inset-x-0 top-0 z-40 transition-all duration-300">
    <div class="max-w-6xl mx-auto px-5 sm:px-8 py-5 flex items-center gap-8">
      <a href="#" onclick="window.scrollTo({top:0,behavior:'smooth'});return false"
        id="header-brand"
        class="text-[11px] tracking-[0.3em] font-semibold uppercase text-white shrink-0 transition-colors duration-300 hover:opacity-60">
      </a>
      <nav id="nav-links" class="hidden md:flex gap-6 flex-1 overflow-x-auto"></nav>
      <button id="menu-btn" class="md:hidden ml-auto w-8 h-8 flex flex-col items-center justify-center gap-1.5"
        aria-label="Menu">
        <span class="w-5 h-px bg-white block transition-all duration-200" id="mb1"></span>
        <span class="w-5 h-px bg-white block transition-all duration-200" id="mb2"></span>
        <span class="w-3 h-px bg-white block self-end transition-all duration-200" id="mb3"></span>
      </button>
    </div>
  </header>

  <!-- ── Menu mobile ──────────────────────────────────────────── -->
  <div id="mobile-menu" class="hidden fixed inset-0 z-30 bg-stone-950/95 backdrop-blur-sm flex flex-col items-center justify-center gap-2">
    <nav id="mobile-nav" class="flex flex-col items-center gap-6 text-center"></nav>
    <button id="mobile-close" class="mt-10 text-white/30 text-xs tracking-widest uppercase">Fermer</button>
  </div>

  <!-- ── Hero full-bleed ──────────────────────────────────────── -->
  <section id="hero" class="relative min-h-[95vh] flex flex-col justify-end overflow-hidden bg-stone-950">
    <img id="cover-img" src="" alt=""
      class="absolute inset-0 w-full h-full object-cover opacity-0 transition-opacity duration-[1400ms]"
      loading="eager" />
    <div class="absolute inset-0 bg-gradient-to-t from-black/85 via-black/25 to-black/30 pointer-events-none"></div>
    <div class="relative z-10 max-w-6xl mx-auto px-5 sm:px-8 pb-20 md:pb-32 w-full">
      <p class="text-[9px] tracking-[0.6em] uppercase text-white/40 mb-7 fade-up">Guide de voyage</p>
      <h1 id="hero-title"
        class="text-[clamp(52px,9vw,104px)] font-light text-white tracking-[-0.02em] leading-[0.92] mb-7 fade-up-2">
      </h1>
      <p id="hero-subtitle" class="text-white/55 text-[15px] max-w-xs leading-relaxed fade-up-3"
        style="font-weight:300"></p>
    </div>
  </section>

  <!-- ── Contenu ──────────────────────────────────────────────── -->
  <main id="content" class="max-w-6xl mx-auto px-4 sm:px-8 pb-40 pt-16 md:pt-20"></main>

  <!-- ── Footer ───────────────────────────────────────────────── -->
  <footer class="py-16 text-center" style="background:#e8e4df;border-top:1px solid rgba(180,170,158,.4)">
    <p id="footer-label" class="text-[9px] tracking-[0.45em] uppercase text-stone-400"></p>
  </footer>

  <!-- ── Lightbox ────────────────────────────────────────────── -->
  <div id="lightbox" role="dialog" aria-modal="true"
    style="display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.97);align-items:center;justify-content:center">

    <!-- Fermer -->
    <button onclick="closeLightbox()" aria-label="Fermer"
      style="position:absolute;top:18px;right:18px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.1);border:none;cursor:pointer;color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;z-index:1;transition:background .15s;font-family:inherit"
      onmouseover="this.style.background='rgba(255,255,255,.22)'" onmouseout="this.style.background='rgba(255,255,255,.1)'">×</button>

    <!-- Précédent -->
    <button id="lb-prev" onclick="lbNav(-1)" aria-label="Précédente"
      style="position:absolute;left:14px;top:50%;transform:translateY(-50%);width:48px;height:72px;border-radius:10px;background:rgba(255,255,255,.07);border:none;cursor:pointer;color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;transition:background .15s;font-family:inherit"
      onmouseover="this.style.background='rgba(255,255,255,.18)'" onmouseout="this.style.background='rgba(255,255,255,.07)'">‹</button>

    <!-- Suivant -->
    <button id="lb-next" onclick="lbNav(1)" aria-label="Suivante"
      style="position:absolute;right:14px;top:50%;transform:translateY(-50%);width:48px;height:72px;border-radius:10px;background:rgba(255,255,255,.07);border:none;cursor:pointer;color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;transition:background .15s;font-family:inherit"
      onmouseover="this.style.background='rgba(255,255,255,.18)'" onmouseout="this.style.background='rgba(255,255,255,.07)'">›</button>

    <!-- Image + légende -->
    <div style="max-width:min(90vw,1300px);max-height:92vh;display:flex;flex-direction:column;align-items:center;gap:14px;padding:0 72px">
      <div style="position:relative;display:inline-block;line-height:0">
        <img id="lb-img" src="" alt=""
          style="max-width:100%;max-height:78vh;object-fit:contain;border-radius:5px;transition:opacity .22s;display:block" />
        <!-- Favori -->
        <button id="lb-star" onclick="toggleFavLb()" aria-label="Favori">★</button>
      </div>
      <div style="text-align:center;min-height:34px">
        <p id="lb-caption"
          style="color:rgba(255,255,255,.5);font-size:13px;font-weight:300;font-family:'Poppins',sans-serif;letter-spacing:.01em"></p>
        <p id="lb-counter"
          style="color:rgba(255,255,255,.2);font-size:10px;margin-top:5px;letter-spacing:.18em;font-family:'Poppins',sans-serif"></p>
      </div>
    </div>
  </div>

  <script src="https://philippebourquin-mq.github.io/guide-engine/engine.js"></script>
  <script>
    GuideEngine.init({
      localStorageKey: 'guide-site-v1',
      dataUrl: './data.json'
    });
  </script>
</body>
</html>
