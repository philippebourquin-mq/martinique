<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guide Martinique</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    ::selection { background: #d6c5b0; }
    html { scroll-behavior: smooth; }
    body { background: #e8e4df; font-family: 'Poppins', system-ui, sans-serif; }

    .font-display { font-family: 'Poppins', system-ui, sans-serif; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-up   { animation: fadeUp  .95s            cubic-bezier(.22,.68,0,1.2) both; }
    .fade-up-2 { animation: fadeUp 1.05s .18s        cubic-bezier(.22,.68,0,1.2) both; }
    .fade-up-3 { animation: fadeUp 1.05s  .36s       cubic-bezier(.22,.68,0,1.2) both; }

    .img-zoom { overflow: hidden; }
    .img-zoom img, .img-zoom-el {
      transition: transform .75s cubic-bezier(.25,.46,.45,.94);
    }
    .img-zoom:hover img, .img-zoom:hover .img-zoom-el {
      transform: scale(1.05);
    }

    /* Card shadow */
    .card { box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.04); }
  </style>
</head>
<body class="text-stone-800 antialiased">

  <!-- ── Header ───────────────────────────────────────────────── -->
  <header id="site-header" class="fixed inset-x-0 top-0 z-40 transition-all duration-300">
    <div class="max-w-6xl mx-auto px-5 sm:px-8 py-5 flex items-center gap-8">
      <a href="#" onclick="window.scrollTo({top:0,behavior:'smooth'});return false"
        id="header-brand"
        class="text-[11px] tracking-[0.3em] font-semibold uppercase text-white shrink-0 transition-colors duration-300 hover:opacity-60">
        Martinique
      </a>
      <nav id="nav-links" class="hidden md:flex gap-6 flex-1 overflow-x-auto"></nav>
    </div>
  </header>

  <!-- ── Hero full-bleed ──────────────────────────────────────── -->
  <section id="hero" class="relative min-h-[95vh] flex flex-col justify-end overflow-hidden bg-stone-950">
    <img id="cover-img" src="" alt="Martinique"
      class="absolute inset-0 w-full h-full object-cover opacity-0 transition-opacity duration-[1400ms]"
      loading="eager" />
    <div class="absolute inset-0 bg-gradient-to-t from-black/85 via-black/25 to-black/30 pointer-events-none"></div>
    <div class="relative z-10 max-w-6xl mx-auto px-5 sm:px-8 pb-20 md:pb-32 w-full">
      <p class="text-[9px] tracking-[0.6em] uppercase text-white/40 mb-7 fade-up">Guide de voyage</p>
      <h1 id="hero-title"
        class="text-[clamp(52px,9vw,104px)] font-light text-white tracking-[-0.02em] leading-[0.92] mb-7 fade-up-2">
        Martinique
      </h1>
      <p id="hero-subtitle" class="text-white/55 text-[15px] max-w-xs leading-relaxed fade-up-3"
        style="font-weight:300"></p>
    </div>
    <div class="absolute bottom-8 left-1/2 -translate-x-1/2 opacity-25 pointer-events-none">
      <div class="w-px h-12 bg-white"></div>
    </div>
  </section>

  <!-- ── Contenu ──────────────────────────────────────────────── -->
  <main id="content" class="max-w-6xl mx-auto px-4 sm:px-8 pb-40 pt-16 md:pt-20"></main>

  <!-- ── Footer ───────────────────────────────────────────────── -->
  <footer class="py-16 text-center" style="background:#e8e4df;border-top:1px solid rgba(180,170,158,.4)">
    <p class="text-[9px] tracking-[0.45em] uppercase text-stone-400">Guide personnel · Martinique</p>
  </footer>

  <script>
    const KEY = 'mtq-guide-v1';

    const DEFAULTS = {
      meta: { title: 'Martinique', subtitle: 'Quelques plans et tips pour ton voyage en Martinique', coverImage: '' },
      sections: [
        { id: 'generalites', title: 'Généralités', items: [
          { title: 'Le créole', text: "Tout le monde parle français, mais comprendre quelques mots de créole aide vraiment — pour la culture, les paroles des sons et… les insultes !", url: '', photo: '', layout: 'default', objectPosition: 'center' },
          { title: 'Les sargasses', text: "Le fléau des sargasses : ces algues brunes venues du large sont toxiques et sentent très fort. La côte atlantique est particulièrement touchée.", url: 'https://meteofrance.mq/fr/sargasses', photo: '', layout: 'default', objectPosition: 'center' },
          { title: 'Connectivité', text: "Vérifier sa couverture téléphonique — souvent incluse dans les forfaits, sinon une SIM disponible à l'aéroport.", url: '', photo: '', layout: 'default', objectPosition: 'center' },
          { title: "L'histoire", text: "L'histoire est omniprésente : l'esclavage, le rôle des « békés »… indispensable pour comprendre l'île.", url: '', photo: '', layout: 'default', objectPosition: 'center' },
        ]},
        { id: 'mood', title: 'Mood', items: [
          { title: 'Rythme de vie', text: "Se lever tôt (7h max), se coucher tôt — calé sur la vie locale, décalage horaire (2h) atténué.", url: '', photo: '', layout: 'default', objectPosition: 'center' },
          { title: 'Conversations', text: "Les gens sont ultra cool et aiment qu'on leur parle. Certaines discussions peuvent dériver vers la politique (souvent juste) ou le complotisme (souvent vertigineux).", url: '', photo: '', layout: 'default', objectPosition: 'center' },
          { title: 'Éviter les pièges', text: "Éviter les ghettos touristiques : Fort-de-France (sans grand intérêt le soir), Trois-Îlets / Pointe du Bout (le Disney de l'île), les Salines (superbe mais aux heures creuses).", url: '', photo: '', layout: 'default', objectPosition: 'center' },
          { title: 'La vie chère', text: "La vie chère n'est pas une légende — éviter d'acheter sur place les produits importés : masque de snorkeling, crème solaire de marque, etc.", url: '', photo: '', layout: 'default', objectPosition: 'center' },
        ]},
        { id: 'transports', title: 'Transports', items: [
          { title: 'Voiture indispensable', text: "La voiture est indispensable. Bus et « taxi co » (mini-bus) existent mais sont vraiment galère pour les coins reculés.", url: '', photo: '', layout: 'default', objectPosition: 'center' },
          { title: "L'île en 5h", text: "L'île est petite — on en fait le tour en 5h de voiture. Ne pas hésiter à partir à l'opposé pour la journée.", url: '', photo: '', layout: 'default', objectPosition: 'center' },
          { title: 'Se garer', text: "Se garer à l'arrache est la norme — petite voiture recommandée.", url: '', photo: '', layout: 'default', objectPosition: 'center' },
          { title: 'La Trace', text: "Routes sûres, mais prudence sur « la Trace » (nord) par temps de pluie.", url: '', photo: '', layout: 'default', objectPosition: 'center' },
          { title: 'Ronds-points', text: "Les locaux roulent très vite. Les ronds-points sont sans pitié — bien les prendre.", url: '', photo: '', layout: 'default', objectPosition: 'center' },
          { title: 'Radars', text: "Attention aux radars : une seule grande route, facile d'y placer des contrôles (et de les repérer sur Waze).", url: '', photo: '', layout: 'default', objectPosition: 'center' },
          { title: 'Bouchons', text: "Bouchons fréquents entre Schœlcher et Saint-Esprit aux heures de pointe.", url: '', photo: '', layout: 'default', objectPosition: 'center' },
        ]},
        { id: 'manger', title: 'Manger', items: [
          { title: 'Restaurants', text: "Le rapport qualité-prix au restaurant peut décevoir. Se préparer un repas pour la plage est souvent le meilleur plan.", url: '', photo: '', layout: 'default', objectPosition: 'center' },
          { title: 'Service', text: "Ne pas être pressé — le service antillais a son propre rythme.", url: '', photo: '', layout: 'default', objectPosition: 'center' },
          { title: 'Marchés & bord de route', text: "Fruits et légumes : le vrai trésor de l'île. Acheter sur les marchés ou en bord de route — plus « peyi » que les supermarchés.", url: '', photo: '', layout: 'default', objectPosition: 'center' },
          { title: 'Glaces au Robert', text: "Les meilleures glaces de l'île : au Robert.", url: 'https://share.google/lf8EHgTlsH01BCBzg', photo: '', layout: 'default', objectPosition: 'center' },
          { title: 'Bokits à Sainte-Anne', text: "Très bons bokits à Sainte-Anne.", url: 'https://share.google/i0fOSeoLE6iH9EBPB', photo: '', layout: 'default', objectPosition: 'center' },
          { title: 'La Terrasse', text: "La Terrasse au rond-point du Diamant.", url: 'https://maps.app.goo.gl/kY8sKMjxQefgL8iz7', photo: '', layout: 'default', objectPosition: 'center' },
          { title: 'Le M', text: "Le M à Sainte-Anne.", url: 'https://maps.app.goo.gl/7av7AvQXTnNL7Rbi6', photo: '', layout: 'default', objectPosition: 'center' },
          { title: 'Le Petibonom', text: "Le Petibonom sur la plage du Carbet.", url: 'https://maps.app.goo.gl/Hmau3YVa19dj4zmF9', photo: '', layout: 'default', objectPosition: 'center' },
          { title: 'Poulet boucané', text: "Incontournable absolu : le poulet boucané en bord de route. Et le snack Alizé (le « McDo local »), partout sur l'île.", url: '', photo: '', layout: 'default', objectPosition: 'center' },
        ]},
        { id: 'activites', title: 'Activités', items: [
          { title: 'Snorkeling & tortues', text: "Snorkeling à Grande Anse ou Anse Dufour pour les tortues. Y aller au lever du soleil, repartir avant l'afflux touristique.", url: '', photo: '', layout: 'default', objectPosition: 'center' },
          { title: 'Plongée au canon', text: "Plongée au canon aux Anses d'Arlet.", url: '', photo: '', layout: 'default', objectPosition: 'center' },
          { title: 'Sortie dauphins', text: "Sortie dauphins avec Markus — la demi-journée est canon ! +596 696 41 18 03", url: 'tel:+596696411803', photo: '', layout: 'default', objectPosition: 'center' },
          { title: 'Randonnées', text: "Morne Larcher, Montagne Pelée (si bonne météo), grand tour de la presqu'île de la Caravelle (Baie du Trésor).", url: '', photo: '', layout: 'default', objectPosition: 'center' },
          { title: 'Jardin de Balata', text: "Touristique mais immanquable. Éviter les horaires bondés.", url: '', photo: '', layout: 'default', objectPosition: 'center' },
          { title: 'Kayak en mangrove', text: "Kayak dans la mangrove au canal Cocotte — prévoir un répulsif anti-moustiques.", url: '', photo: '', layout: 'default', objectPosition: 'center' },
          { title: 'Carnaval & Yoles', text: "Carnaval ou Tour des Yoles : fête permanente.", url: '', photo: '', layout: 'default', objectPosition: 'center' },
          { title: 'Cinéma Madiana', text: "Jours de pluie : cinéma Madiana à Schœlcher — excellent complexe.", url: '', photo: '', layout: 'default', objectPosition: 'center' },
        ]},
        { id: 'nature', title: 'Nature', items: [
          { title: 'Mer ou rivière', text: "Mer ou rivière (« rivié ») — les locaux préfèrent souvent la fraîcheur des rivières.", url: '', photo: '', layout: 'default', objectPosition: 'center' },
          { title: 'Cascades', text: "Pas spectaculaires, mais les balades pour y accéder sont sympas. Cascade Didier en particulier.", url: '', photo: '', layout: 'default', objectPosition: 'center' },
          { title: 'Les meilleures anses', text: "Eau à 28° : Anse Couleuvre, Anse Figuier, Petite Anse, presqu'île de la Caravelle, plage du Diamant (attention aux courants).", url: '', photo: '', layout: 'default', objectPosition: 'center' },
          { title: 'Mancelliniers', text: "Ne jamais s'abriter sous les mancelliniers (arbres marqués rouge — pluie acide), ni sous des cocotiers secs, ni près des sorties d'eau sale.", url: '', photo: '', layout: 'default', objectPosition: 'center' },
        ]},
      ]
    };

    /* ── Illustrations ──────────────────────────────────────────── */
    const ILLUSTRATIONS = {
      generalites: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="50" cy="50" r="34" stroke-width="1.8"/><circle cx="50" cy="50" r="4" fill="currentColor" stroke="none"/>
        <line x1="50" y1="16" x2="50" y2="28" stroke-width="2"/><line x1="50" y1="72" x2="50" y2="84" stroke-width="2"/>
        <line x1="16" y1="50" x2="28" y2="50" stroke-width="2"/><line x1="72" y1="50" x2="84" y2="50" stroke-width="2"/>
        <path d="M50 20 L53.5 47 L50 53 L46.5 47Z" fill="currentColor" stroke="none" opacity="0.7"/>
      </svg>`,
      mood: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-linecap="round">
        <circle cx="50" cy="52" r="18" stroke-width="1.8"/>
        <line x1="50" y1="20" x2="50" y2="30" stroke-width="2"/><line x1="72" y1="27" x2="66" y2="33" stroke-width="2"/>
        <line x1="79" y1="49" x2="69" y2="49" stroke-width="2"/><line x1="28" y1="27" x2="34" y2="33" stroke-width="2"/>
        <line x1="21" y1="49" x2="31" y2="49" stroke-width="2"/>
        <line x1="12" y1="68" x2="88" y2="68" stroke-width="1.4"/>
        <path d="M12 76 Q30 72 50 76 Q70 80 88 76" stroke-width="1.2" opacity="0.5"/>
      </svg>`,
      transports: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="50" cy="50" r="33" stroke-width="1.8"/><circle cx="50" cy="50" r="9" stroke-width="1.8"/>
        <line x1="50" y1="41" x2="50" y2="17" stroke-width="1.8"/>
        <line x1="42.2" y1="45.5" x2="21" y2="62.5" stroke-width="1.8"/>
        <line x1="57.8" y1="45.5" x2="79" y2="62.5" stroke-width="1.8"/>
      </svg>`,
      manger: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <line x1="34" y1="78" x2="34" y2="50" stroke-width="1.8"/><line x1="27" y1="22" x2="27" y2="42" stroke-width="1.8"/>
        <line x1="34" y1="22" x2="34" y2="42" stroke-width="1.8"/><line x1="41" y1="22" x2="41" y2="42" stroke-width="1.8"/>
        <path d="M27 42 Q34 51 41 42" stroke-width="1.8"/>
        <line x1="66" y1="22" x2="66" y2="78" stroke-width="1.8"/><path d="M66 22 Q78 34 66 55" stroke-width="1.8"/>
      </svg>`,
      activites: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 63 Q28 34 58 37 Q77 39 82 55 Q85 66 72 68 Q59 70 49 59 Q39 48 15 63Z" stroke-width="1.8"/>
        <path d="M15 63 Q7 51 11 40" stroke-width="1.8"/><path d="M15 63 Q5 68 9 76" stroke-width="1.8"/>
        <path d="M54 41 Q58 24 67 33" stroke-width="1.8"/>
        <circle cx="73" cy="57" r="3" fill="currentColor" stroke="none"/>
      </svg>`,
      nature: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 76 L42 22 L60 44 L70 32 L90 76Z" stroke-width="1.8"/>
        <line x1="20" y1="76" x2="27" y2="47" stroke-width="1.8"/>
        <path d="M27 47 Q15 38 9 44" stroke-width="1.6"/>
        <path d="M27 47 Q22 36 27 26" stroke-width="1.6"/>
        <path d="M27 47 Q37 38 43 44" stroke-width="1.6"/>
      </svg>`,
    };
    const ILLUS_FALLBACK = `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-linecap="round">
      <circle cx="50" cy="50" r="32" stroke-width="1.8"/></svg>`;

    function esc(s) {
      return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function illus(id) { return ILLUSTRATIONS[id] || ILLUS_FALLBACK; }

    /* ── Header ─────────────────────────────────────────────────── */
    let _scrolled = false;
    function applyHeader(on) {
      _scrolled = on;
      const h = document.getElementById('site-header');
      const b = document.getElementById('header-brand');
      h.style.cssText = on
        ? 'background:rgba(232,228,223,.97);backdrop-filter:blur(16px);border-bottom:1px solid rgba(175,165,152,.3)'
        : '';
      b.style.color = on ? '#1c1917' : '#fff';
      document.querySelectorAll('#nav-links a').forEach(a => {
        a.style.color = on ? '#78716c' : 'rgba(255,255,255,.45)';
        a.onmouseover = () => { a.style.color = on ? '#1c1917' : '#fff'; };
        a.onmouseout  = () => { a.style.color = on ? '#78716c' : 'rgba(255,255,255,.45)'; };
      });
    }
    window.addEventListener('scroll', () => {
      applyHeader(window.scrollY > (document.getElementById('hero')?.offsetHeight || 600) * 0.5);
    }, { passive: true });

    /* ── Lien ───────────────────────────────────────────────────── */
    function mkLink(item, light) {
      if (!item.url?.trim()) return '';
      const phone = item.url.startsWith('tel:');
      const cls = light
        ? 'inline-flex items-center gap-1 text-[9px] tracking-[0.15em] uppercase text-white/60 hover:text-white border-b border-white/25 hover:border-white pb-px transition-colors'
        : 'inline-flex items-center gap-1 text-[9px] tracking-[0.15em] uppercase text-stone-400 hover:text-stone-900 border-b border-stone-200 hover:border-stone-700 pb-px transition-colors';
      return `<a href="${esc(item.url)}"${phone?'':' target="_blank" rel="noopener"'} class="${cls}">
        ${phone ? 'Appeler' : '↗ Voir'}
      </a>`;
    }

    /* ── Cartes ─────────────────────────────────────────────────── */
    function renderItem(item) {
      const hasPhoto = item.photo?.trim();
      const layout   = item.layout || 'default';
      const pos      = item.objectPosition || 'center';
      const title    = item.title?.trim();

      /* BANNIÈRE — photo pleine largeur, texte superposé */
      if (hasPhoto && layout === 'highlight') {
        return `
          <article class="col-span-full relative img-zoom rounded-2xl overflow-hidden card cursor-default"
            style="min-height:320px;aspect-ratio:21/9">
            <img src="${esc(item.photo)}" alt=""
              class="img-zoom-el absolute inset-0 w-full h-full object-cover"
              style="object-position:${esc(pos)}" loading="lazy" />
            <div class="absolute inset-0 bg-gradient-to-t from-black/85 via-black/30 to-black/5"></div>
            <div class="absolute inset-x-0 bottom-0 p-6 md:p-10">
              ${title ? `<h3 class="text-white font-semibold leading-tight mb-3"
                style="font-size:clamp(20px,2.8vw,34px)">${esc(title)}</h3>` : ''}
              <p class="text-white/65 text-[13px] md:text-[14px] leading-relaxed max-w-xl mb-4 font-light">${esc(item.text)}</p>
              ${mkLink(item, true)}
            </div>
          </article>`;
      }

      /* PHOTO VIGNETTE — image avec texte superposé, 1 colonne */
      if (hasPhoto) {
        return `
          <article class="relative img-zoom rounded-2xl overflow-hidden card cursor-default"
            style="min-height:260px">
            <img src="${esc(item.photo)}" alt=""
              class="img-zoom-el absolute inset-0 w-full h-full object-cover"
              style="object-position:${esc(pos)}" loading="lazy" />
            <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent"></div>
            <div class="absolute inset-x-0 bottom-0 p-5">
              ${title ? `<h3 class="text-white font-semibold text-[18px] leading-tight mb-1.5">${esc(title)}</h3>` : ''}
              <p class="text-white/70 text-[12.5px] leading-relaxed mb-2.5 font-light">${esc(item.text)}</p>
              ${mkLink(item, true)}
            </div>
          </article>`;
      }

      /* CITATION — texte pleine largeur, style pull-quote magazine */
      if (layout === 'highlight') {
        return `
          <article class="col-span-full py-10 md:py-14">
            <div class="flex gap-6 md:gap-10 items-start">
              <div class="shrink-0 w-1 self-stretch rounded-full" style="background:linear-gradient(180deg,#a8967a 0%,rgba(168,150,122,.15) 100%)"></div>
              <div class="flex-1 min-w-0">
                ${title ? `<h3 class="font-bold text-stone-900 leading-tight mb-3"
                  style="font-size:clamp(22px,3vw,38px);letter-spacing:-0.02em">${esc(title)}</h3>` : ''}
                <p class="text-[15px] md:text-[16px] text-stone-500 leading-relaxed font-light max-w-2xl">${esc(item.text)}</p>
                ${mkLink(item, false) ? `<div class="mt-4">${mkLink(item, false)}</div>` : ''}
              </div>
            </div>
          </article>`;
      }

      /* CARTE TEXTE — fond blanc, grille */
      return `
        <article class="bg-white rounded-2xl p-5 md:p-6 flex flex-col gap-3 card" style="min-height:140px">
          ${title ? `<h3 class="text-stone-900 font-semibold leading-snug" style="font-size:16px">${esc(title)}</h3>` : ''}
          <p class="text-[13px] text-stone-500 leading-relaxed flex-1 font-light">${esc(item.text)}</p>
          ${mkLink(item, false)}
        </article>`;
    }

    /* ── Section ─────────────────────────────────────────────────── */
    function render(d) {
      document.title = 'Guide ' + d.meta.title;

      /* Hero */
      document.getElementById('hero-title').textContent    = d.meta.title;
      document.getElementById('hero-subtitle').textContent = d.meta.subtitle;
      const ci = document.getElementById('cover-img');
      ci.style.objectPosition = d.meta.coverObjectPosition || 'center';
      if (d.meta.coverImage) {
        if (ci.getAttribute('src') !== d.meta.coverImage) {
          ci.style.opacity = '0';
          ci.onload = () => { ci.style.opacity = '1'; };
          ci.src = d.meta.coverImage;
        }
      } else {
        ci.style.opacity = '0'; ci.src = '';
      }

      /* Nav */
      document.getElementById('nav-links').innerHTML = d.sections.map(s =>
        `<a href="#${s.id}" style="color:${_scrolled?'#78716c':'rgba(255,255,255,.45)'};font-weight:500"
          class="text-[10px] tracking-[0.2em] uppercase transition-colors whitespace-nowrap"
          onmouseover="this.style.color='${_scrolled?'#1c1917':'#fff'}'"
          onmouseout="this.style.color='${_scrolled?'#78716c':'rgba(255,255,255,.45)'}'">
          ${esc(s.title)}
        </a>`
      ).join('');

      /* Sections */
      document.getElementById('content').innerHTML = d.sections.map((s, i) => `
        <section id="${s.id}" class="scroll-mt-24 mb-14 md:mb-20">
          <div class="flex items-center justify-between gap-4 mb-5 pb-4"
            style="border-bottom:1px solid rgba(160,150,140,.35)">
            <div class="flex items-center gap-3.5">
              <span class="text-[10px] tabular-nums tracking-[0.28em] text-stone-400 font-light select-none">
                ${String(i+1).padStart(2,'0')}
              </span>
              <div class="w-px h-3.5 bg-stone-400/40"></div>
              <h2 class="text-[14px] font-semibold text-stone-800 tracking-[0.06em] uppercase">${esc(s.title)}</h2>
            </div>
            <div class="w-[22px] h-[22px] shrink-0 text-stone-600">${illus(s.id)}</div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 md:gap-4">
            ${s.items.map(item => renderItem(item)).join('')}
          </div>
        </section>
      `).join('');

      applyHeader(_scrolled);
    }

    /* ── Données ────────────────────────────────────────────────── */
    const cached = (() => { try { return JSON.parse(localStorage.getItem(KEY)); } catch {} return null; })();
    render(cached || DEFAULTS);

    fetch('./data.json?' + Date.now())
      .then(r => r.ok ? r.json() : null)
      .then(data => { if (!data) return; try { localStorage.setItem(KEY, JSON.stringify(data)); } catch {} render(data); })
      .catch(() => {});

    window.addEventListener('storage', () => {
      const d = (() => { try { return JSON.parse(localStorage.getItem(KEY)); } catch {} return null; })();
      if (d) render(d);
    });
    window.addEventListener('pageshow', e => {
      if (e.persisted) { const d = (() => { try { return JSON.parse(localStorage.getItem(KEY)); } catch {} return null; })(); render(d || DEFAULTS); }
    });
  </script>
</body>
</html>
